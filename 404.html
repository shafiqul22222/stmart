<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // বর্তমান লিংকটি সেভ করে রাখা
        sessionStorage.redirect = location.href;
        
        var l = window.location;
        var basePath = '/';
        var pathSegments = l.pathname.split('/').filter(Boolean);
        
        // যদি GitHub Pages এ হোস্ট করা থাকে, তবে রিপোজিটরির নাম ধরে রাখা
        if(l.hostname.includes('github.io') && pathSegments.length > 0) {
            basePath = '/' + pathSegments[0] + '/';
        }
        
        // সঠিক Base URL এ পাঠিয়ে দেওয়া
        window.location.replace(basePath);
    </script>
</head>
<body></body>
</html>
