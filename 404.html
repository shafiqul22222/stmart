<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Loading...</title>
    <script>
        // যে লিংকে ইউজার ভিজিট করেছে, সেটি সেভ করে রাখা হচ্ছে
        sessionStorage.redirect = window.location.href;
        
        // GitHub Pages এর জন্য ফোল্ডারের (Repo) নাম বের করা
        var segments = window.location.pathname.split('/').filter(Boolean);
        var basePath = (window.location.hostname.includes('github.io') && segments.length > 0) ? '/' + segments[0] + '/' : '/';
        
        // মেইন index.html এ পাঠিয়ে দেওয়া হচ্ছে
        window.location.replace(basePath);
    </script>
</head>
<body></body>
</html>
